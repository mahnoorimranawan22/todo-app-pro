# Render Blueprint — deploy "Todo App Pro" with one click.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: todo-app-pro
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Fill these in the Render dashboard after deploy:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
